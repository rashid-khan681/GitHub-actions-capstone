# Goal: Reusbele Build and Push
# Description: This workflow acts as a modular template to containerize our 
#              applications. It authenticates with Docker Hub, builds the image 
#              using the specified Dockerfile, and pushes it to the registry.

name: Reusable Docker Build and Push

on:
    workflow_call:
        inputs:
            image-name:
                description: 'Name of the Docker image'
                required: true
                type: string
            tag:
                description: 'Tag for the Docker image'
                required: true
                type: string
            working-directory:
                description: 'Directory containing the Dockerfile (e.g., ./backend)'
                required: false
                default: './backend'
                type: string
            
        
        # secrets passed from the caller workflow for secure login
        secrets:
            DOCKER_USERNAME:
                required: true
            DOCKER_PASSWORD:
                required: true

        outputs:
            image_url:
                description: 'Full path of the pushed Docker image'
                value: ${{ jobs.docker-build-push.outputs.final_image_url }}

jobs:
    docker-build-push:
        name: Build and Push Docker Image
        runs-on: ubuntu-latest

        outputs:
            final_image_url: ${{ steps.set-output.outputs.final_image_url }}

        defaults:
            run:
                working-directory: ${{ inputs.working-directory }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Log in Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: build and Push
              uses: docker/build-push-action@v5
              with:
                context: ${{ inputs.working-directory }}
                push: true
                tags: ${{ inputs.image-name }}:${{ inputs.tag }}

            - name: Set image URL output
              id: set-output
              run: |
                echo "final_image_url=${{ inputs.image-name }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
                


        
